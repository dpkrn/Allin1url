services:
  backend:
    build: ./backend
    container_name: backend
    expose:
      - "8080"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  frontend:
    build: ./frontend
    container_name: frontend
    expose:
      - "80"
    environment:
      - VITE_API_URL=https://clickly.cv
    depends_on:
      - backend

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    expose:
      - "5678"
    environment:
      - N8N_HOST=n8n.clickly.cv
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      # Trust nginx (1 proxy): fixes "X-Forwarded-For header set but trust proxy is false"
      - N8N_PROXY_HOPS=1
      # Required: nginx (another container) can only reach n8n if it listens on 0.0.0.0
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.clickly.cv
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
      - n8n

volumes:
  n8n_data:
