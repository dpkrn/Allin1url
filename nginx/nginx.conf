events {
    worker_connections 1024;
}

http {
    # Normalize Origin header: strip trailing dot so n8n origin validation passes (n8n.allin1url.in. -> n8n.allin1url.in)
    map $http_origin $origin_normalized {
        default $http_origin;
        "https://n8n.allin1url.in." "https://n8n.allin1url.in";
        "http://n8n.allin1url.in." "http://n8n.allin1url.in";
    }

    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # SSL Configuration (shared across all HTTPS servers)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (shared)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTTP server - redirect all to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name allin1url.in www.allin1url.in *.allin1url.in;

        # Allow Let's Encrypt HTTP-01 challenges (for initial cert or renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server for main domain (allin1url.in, www.allin1url.in)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name allin1url.in www.allin1url.in;

        # SSL Certificate paths
        # For wildcard subdomains, use wildcard certificate path
        # If you have separate certs, use: /etc/letsencrypt/live/allin1url.in/fullchain.pem
        ssl_certificate /etc/letsencrypt/live/allin1url.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/allin1url.in/privkey.pem;

        # OCSP Stapling
        ssl_trusted_certificate /etc/letsencrypt/live/allin1url.in/chain.pem;

        # Redirect www to non-www (optional - remove if you want both)
        if ($host = www.allin1url.in) {
            return 301 https://allin1url.in$request_uri;
        }

        # Root path redirects to frontend app
        location = / {
            return 301 https://allin1url.in/app/;
        }

        location = /app {
            return 301 https://allin1url.in/app/;
        }

        # Frontend application routes
        location ^~ /app {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

          # Backend API and other routes
        location / {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }


    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name n8n.allin1url.in n8n.allin1url.in.;

        # Redirect trailing-dot host to canonical URL so n8n origin validation passes (Origin: n8n.allin1url.in not n8n.allin1url.in.)
        if ($host = "n8n.allin1url.in.") {
            return 301 https://n8n.allin1url.in$request_uri;
        }

        ssl_certificate /etc/letsencrypt/live/allin1url.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/allin1url.in/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/allin1url.in/chain.pem;

        location / {
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Origin $origin_normalized;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;

            # n8n needs this for webhooks & UI
            proxy_buffering off;
        }
    }

    # HTTPS server for wildcard subdomains (*.allin1url.in)
    # This handles all user subdomains like dpkrn.allin1url.in
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name *.allin1url.in;

        # SSL Certificate paths
        # IMPORTANT: For wildcard subdomains, you MUST have a wildcard SSL certificate
        # Standard certificates (allin1url.in, www.allin1url.in) do NOT cover subdomains
        # 
        # Certificate location: Check both possible locations
        #   - /etc/letsencrypt/live/allin1url.in-0001/ (common for renewals)
        #   - /etc/letsencrypt/live/allin1url.in/ (if first cert)
        #   - Check with: sudo ls -la /etc/letsencrypt/live/
        #
        # Verify certificate includes wildcard:
        #   sudo openssl x509 -in /etc/letsencrypt/live/allin1url.in-0001/fullchain.pem -text -noout | grep "*.allin1url.in"
        #
        # Update paths below if your certificate is in a different location
        ssl_certificate /etc/letsencrypt/live/allin1url.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/allin1url.in/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/allin1url.in/chain.pem;

        # All subdomain requests go to backend for subdomain routing
        # Backend middleware will extract username from subdomain
        location / {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            
            # Proxy headers - preserve original host for subdomain detection
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}

# ============================================================================
# DEPLOYMENT NOTES:
# ============================================================================
# 1. SSL Certificate Requirements:
#    - For wildcard subdomains (*.allin1url.in), you need a wildcard SSL certificate
#    - Generate using: certbot certonly --manual --preferred-challenges dns -d "*.allin1url.in" -d "allin1url.in"
#    - Or use DNS API plugin if your DNS provider supports it
#    - Update ssl_certificate paths above if using separate wildcard cert
#
# 2. DNS Configuration:
#    - Ensure wildcard A record (*) points to your EC2 instance IP
#    - Verify with: dig *.allin1url.in
#
# 3. Testing:
#     - Test n8n domain: curl -I https://n8n.allin1url.in
#    - Test main domain: curl -I https://allin1url.in
#    - Test subdomain: curl -I https://dpkrn.allin1url.in
#    - Check SSL: openssl s_client -connect allin1url.in:443 -servername allin1url.in
#
# 4. Reload nginx after changes:
#    - docker exec nginx nginx -t  # Test configuration
#    - docker exec nginx nginx -s reload  # Reload configuration
# ============================================================================
